[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpxtable"
description = "Generate tables of interesting GPX route and waypoint information"
authors = [
  { name="Paul Traina", email="pleasantone@users.noreply.github.com" },
]
keywords = ["GPS", "GPX", "Navigation", "Track", "Route", "Waypoints"]

dynamic = ["version"]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Framework :: Flask",
    "Environment :: Console",
]
dependencies = [
    "astral>=3.2",
    "gpxpy>=1.6.2",
    "markdown2>=2.5.5",
    "python-dateutil>=2.9",
]
[project.optional-dependencies]
web = [
    "flask>=3.1.3",
    "requests>=2.34.2",
]
gunicorn = [
    "gpxtable[web]",
    "gunicorn>=26.0.0",
]
tests = [
    "pytest>=9.1.1",
    "pytest-flask>=1.3.0",
    "responses>=0.26.2",
]
lint = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "types-python-dateutil>=2.9.0.20260716",
    "types-requests>=2.33.0.20260712",
]
dev = [
    "gpxtable[gunicorn,tests,lint]",
]

[project.urls]
"Homepage" = "https://github.com/pleasantone/gpxtable"
"Issues" = "https://github.com/pleasantone/gpxtable/issues"
"Repository" = "https://github.com/pleasantone/gpxtable"
"Documentation" = "https://gpxtable.readthedocs.io"

[project.scripts]
gpxtable = "gpxtable.cli:main"

[tool.setuptools.dynamic]
version = {attr = "gpxtable.__version__"}

[tool.setuptools.package-data]
gpxtable = ["static/*", "templates/*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's implicit default set grows with each
# release, so relying on it turns a routine ruff upgrade into a broken build.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.isort]
# "conftest" is the test suite's own shared-helper module, not a third-party package.
known-first-party = ["gpxtable", "conftest"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["markdown2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
